# Stage 2: Coupled length gradients after CTC convergence
# Purpose: Load a converged stage1 checkpoint and fine-tune with length gradients
# flowing through the BiRNN (length_detach: false) for a few epochs.

model:
  encoder_path: null
  init_checkpoint: null  # SET THIS to the stage1 output dir before running
  freeze_encoder: false
  encoder_lr_scale: 0.05

  projector_dim: 128
  adapter_num_stages: 2
  adapter_kernel_size: 5
  adapter_stride: 2

  rnn_type: lstm
  rnn_hidden: 128
  rnn_layers: 1
  rnn_bidirectional: true
  rnn_dropout: 0.1

  num_chars: 26
  blank_idx: 26
  text_mask_prob: 1.0

  # Length prediction — coupled gradients
  predict_length: true
  length_hidden_dim: 64
  length_loss_weight: 0.1
  length_detach: false

data:
  dataset_name: "futo-org/swipe.futo.org"
  train_split: "train"
  val_split: "validation"
  path_resample_mode: "time"
  vocab_path: "data/vocabulary.txt"
  extra_npz_paths:
    - "/home/lee/Documents/FUTO/encodercnn/data/npz/hws/"
    - "/home/lee/Documents/FUTO/encodercnn/data/npz/staticwebtests/"
    - "/home/lee/Documents/FUTO/encodercnn/data/npz/blended_50/"
    - "/home/lee/Documents/FUTO/encodercnn/data/npz/blended_50_full/"
  max_train_samples: null
  max_eval_samples: 10000

training:
  training_args:
    output_dir: "checkpoints/distill"
    logging_dir: "logs/distill"
    num_train_epochs: 3
    per_device_train_batch_size: 1024
    per_device_eval_batch_size: 1024
    gradient_accumulation_steps: 1
    learning_rate: 0.0003
    weight_decay: 0.01
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"
    logging_steps: 10
    eval_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "eval_word_acc"
    greater_is_better: true
    bf16: true
    fp16: false
    remove_unused_columns: false
    report_to:
      - "tensorboard"
    dataloader_num_workers: 4
    dataloader_pin_memory: true
    max_grad_norm: 1.0
    save_safetensors: true
