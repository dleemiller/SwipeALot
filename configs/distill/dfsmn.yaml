# DFSMN decoder with CTC loss
# Unfrozen encoder with moderate LR scale (0.05), 20 epochs.

model:
  #encoder_path: "checkpoints/base_20260212_171550/final"
  encoder_path: "checkpoints/base_20260406_173839/final"
  freeze_encoder: false
  encoder_lr_scale: 0.05  # encoder LR = 0.001 * 0.05 = 0.00005

  projector_dim: 128
  adapter_num_stages: 2
  adapter_kernel_size: 2
  adapter_stride: 2
  adapter_double_channels: true  # 128→256 at last stage

  # DFSMN decoder (replaces BiLSTM)
  decoder_type: dfsmn
  rnn_hidden: 256  # decoder hidden dimension (matches adapter output)
  dfsmn_num_layers: 8
  dfsmn_proj_dim: 64
  dfsmn_context: 7

  num_chars: 26
  blank_idx: 26
  text_mask_prob: 1.0

data:
  dataset_name: "futo-org/swipe-multilingual-compiled"
  dataset_config: "swipes"
  train_split: "train"
  val_split: "valid"
  exclude_sources:
    - "yandex"
    - "indic_swipe"
  path_resample_mode: "time"
  vocab_path: "data/vocabulary.txt"
  extra_npz_paths:
    - "/home/lee/Documents/FUTO/encodercnn/data/sal_npz/hws/"
    - "/home/lee/Documents/FUTO/encodercnn/data/sal_npz/staticwebtests/"
  max_train_samples: null
  max_eval_samples: 10000

training:
  training_args:
    output_dir: "checkpoints/distill"
    logging_dir: "logs/distill"
    num_train_epochs: 20
    per_device_train_batch_size: 1024
    per_device_eval_batch_size: 1024
    gradient_accumulation_steps: 1
    learning_rate: 0.001
    weight_decay: 0.01
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    logging_steps: 10
    eval_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "eval_word_acc"
    greater_is_better: true
    bf16: true
    fp16: false
    remove_unused_columns: false
    report_to:
      - "tensorboard"
    dataloader_num_workers: 4
    dataloader_pin_memory: true
    max_grad_norm: 1.0
