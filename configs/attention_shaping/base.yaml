model:
  encoder_path: "checkpoints/base_20260212_171550/final"
  projector_dim: 128
  attention_target_layers: [4, 5, 6]
  softplus_beta: 1.0
  huber_beta: 0.01
  char_kl_weight: 0.2
  valid_huber_weight: 5.0
  length_loss_weight: 0.1

data:
  dataset_name: "futo-org/swipe.futo.org"
  train_split: "train"
  val_split: "validation"
  path_resample_mode: "time"
  max_eval_samples: 10000

training:
  training_args:
    output_dir: "checkpoints/attention_shaping"
    logging_dir: "logs/attention_shaping"
    num_train_epochs: 5
    per_device_train_batch_size: 512
    per_device_eval_batch_size: 512
    learning_rate: 0.001
    weight_decay: 0.01
    warmup_ratio: 0.05
    lr_scheduler_type: "cosine"
    logging_steps: 10
    eval_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    bf16: true
    remove_unused_columns: false
    report_to: ["tensorboard"]
    dataloader_num_workers: 4
    dataloader_pin_memory: true
    max_grad_norm: 1.0
    save_safetensors: true
